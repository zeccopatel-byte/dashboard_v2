<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar Switchboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one isometric diagnostic switchboard on paper with a risk gauge above; the glow under the active switch is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night, .lamp { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper, .lamp { fill: var(--paper); } .f-night { fill: var(--night); }
.ink-line, .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ic { stroke-width: 1.2; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .45; vector-effect: non-scaling-stroke; }
.needle-l { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.dot { fill: var(--ink); }
.lbl { font-family: var(--mono); font-weight: 500; fill: var(--ink); }
.lbl.row { font-size: .28px; letter-spacing: .08px; }
.lbl.nm { font-size: .23px; letter-spacing: .03px; dominant-baseline: middle; }
.lbl.sm { font-size: .2px; letter-spacing: .05px; text-anchor: middle; }
.lbl.xs { font-size: .16px; letter-spacing: .06px; text-anchor: middle; opacity: .6; }
/* resting state, also the reduced-motion state: every problem switched on, needle at HIGH, glow on the last switch */
.offp { opacity: 0; }
.lamp { fill: var(--night); }
.needle { transform: rotate(65deg); }
.glow { transform: translate(6px,2.95px); }
@keyframes n0 {
  0.000% { opacity:0; }
  8.571% { opacity:1; }
  68.571% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o0 {
  0.000% { opacity:1; }
  8.571% { opacity:0; }
  68.571% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l0 {
  0.000% { fill: var(--paper); }
  8.571% { fill: var(--night); }
  9.286% { fill: var(--paper); }
  10.000% { fill: var(--night); }
  68.571% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s0n { animation: n0 7s steps(1,end) infinite; } .s0o { animation: o0 7s steps(1,end) infinite; } .l0 { animation: l0 7s steps(1,end) infinite; }
@keyframes n1 {
  0.000% { opacity:0; }
  10.286% { opacity:1; }
  66.857% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o1 {
  0.000% { opacity:1; }
  10.286% { opacity:0; }
  66.857% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l1 {
  0.000% { fill: var(--paper); }
  10.286% { fill: var(--night); }
  11.000% { fill: var(--paper); }
  11.714% { fill: var(--night); }
  66.857% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s1n { animation: n1 7s steps(1,end) infinite; } .s1o { animation: o1 7s steps(1,end) infinite; } .l1 { animation: l1 7s steps(1,end) infinite; }
@keyframes n2 {
  0.000% { opacity:0; }
  12.000% { opacity:1; }
  65.143% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o2 {
  0.000% { opacity:1; }
  12.000% { opacity:0; }
  65.143% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l2 {
  0.000% { fill: var(--paper); }
  12.000% { fill: var(--night); }
  12.714% { fill: var(--paper); }
  13.429% { fill: var(--night); }
  65.143% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s2n { animation: n2 7s steps(1,end) infinite; } .s2o { animation: o2 7s steps(1,end) infinite; } .l2 { animation: l2 7s steps(1,end) infinite; }
@keyframes n3 {
  0.000% { opacity:0; }
  13.714% { opacity:1; }
  63.429% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o3 {
  0.000% { opacity:1; }
  13.714% { opacity:0; }
  63.429% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l3 {
  0.000% { fill: var(--paper); }
  13.714% { fill: var(--night); }
  14.429% { fill: var(--paper); }
  15.143% { fill: var(--night); }
  63.429% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s3n { animation: n3 7s steps(1,end) infinite; } .s3o { animation: o3 7s steps(1,end) infinite; } .l3 { animation: l3 7s steps(1,end) infinite; }
@keyframes n4 {
  0.000% { opacity:0; }
  15.429% { opacity:1; }
  61.714% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o4 {
  0.000% { opacity:1; }
  15.429% { opacity:0; }
  61.714% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l4 {
  0.000% { fill: var(--paper); }
  15.429% { fill: var(--night); }
  16.143% { fill: var(--paper); }
  16.857% { fill: var(--night); }
  61.714% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s4n { animation: n4 7s steps(1,end) infinite; } .s4o { animation: o4 7s steps(1,end) infinite; } .l4 { animation: l4 7s steps(1,end) infinite; }
@keyframes n5 {
  0.000% { opacity:0; }
  17.143% { opacity:1; }
  60.000% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes o5 {
  0.000% { opacity:1; }
  17.143% { opacity:0; }
  60.000% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes l5 {
  0.000% { fill: var(--paper); }
  17.143% { fill: var(--night); }
  17.857% { fill: var(--paper); }
  18.571% { fill: var(--night); }
  60.000% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.s5n { animation: n5 7s steps(1,end) infinite; } .s5o { animation: o5 7s steps(1,end) infinite; } .l5 { animation: l5 7s steps(1,end) infinite; }
@keyframes glow {
  0.000% { transform: translate(0.0px,0.0px); opacity:0; }
  8.286% { transform: translate(0.0px,0.0px); opacity:0; }
  9.714% { transform: translate(0.0px,0.0px); opacity:1; }
  10.143% { transform: translate(0.0px,0.0px); opacity:1; }
  11.429% { transform: translate(3.0px,0.0px); opacity:1; }
  11.857% { transform: translate(3.0px,0.0px); opacity:1; }
  13.143% { transform: translate(6.0px,0.0px); opacity:1; }
  13.571% { transform: translate(6.0px,0.0px); opacity:1; }
  14.857% { transform: translate(0.0px,2.95px); opacity:1; }
  15.286% { transform: translate(0.0px,2.95px); opacity:1; }
  16.571% { transform: translate(3.0px,2.95px); opacity:1; }
  17.000% { transform: translate(3.0px,2.95px); opacity:1; }
  18.286% { transform: translate(6.0px,2.95px); opacity:1; }
  59.857% { transform: translate(6.0px,2.95px); opacity:1; }
  61.143% { transform: translate(3.0px,2.95px); opacity:1; }
  61.571% { transform: translate(3.0px,2.95px); opacity:1; }
  62.857% { transform: translate(0.0px,2.95px); opacity:1; }
  63.286% { transform: translate(0.0px,2.95px); opacity:1; }
  64.571% { transform: translate(6.0px,0.0px); opacity:1; }
  65.000% { transform: translate(6.0px,0.0px); opacity:1; }
  66.286% { transform: translate(3.0px,0.0px); opacity:1; }
  66.714% { transform: translate(3.0px,0.0px); opacity:1; }
  68.000% { transform: translate(0.0px,0.0px); opacity:1; }
  68.571% { transform: translate(0.0px,0.0px); opacity:1; }
  72.857% { transform: translate(0.0px,0.0px); opacity:0; }
  100.000% { transform: translate(0.0px,0.0px); opacity:0; }
}
@keyframes needle {
  0.000% { transform: rotate(-65deg); }
  8.571% { transform: rotate(-65deg); }
  10.000% { transform: rotate(-33deg); }
  10.286% { transform: rotate(-36deg); }
  11.714% { transform: rotate(-7deg); }
  12.000% { transform: rotate(-10deg); }
  13.429% { transform: rotate(19deg); }
  13.714% { transform: rotate(16deg); }
  15.143% { transform: rotate(45deg); }
  15.429% { transform: rotate(42deg); }
  16.857% { transform: rotate(71deg); }
  17.143% { transform: rotate(68deg); }
  18.571% { transform: rotate(97deg); }
  23.571% { transform: rotate(65deg); }
  69.286% { transform: rotate(65deg); }
  91.429% { transform: rotate(-65deg); }
  100.000% { transform: rotate(-65deg); }
}
.glow { animation: glow 7s var(--ease) infinite; }
.needle { animation: needle 7s var(--ease) infinite; }
@media not all {
  .offp, .onp, .lamp, .glow, .needle { animation: none !important; }
}
</style>
</head>
