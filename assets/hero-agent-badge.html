<style>
/* Layout: one isometric ID reader centred on paper; four credential cards assemble on a robot agent in brand-gradient cards, a shadow AI cube waits to the side */
:root {
  --paper: #F5F3F0;
  --white: #FFFFFF;
  --ink: #141414;
  --night: url(#avnight);
  --signal: #FF4B1F;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --zen: "Zen Dots", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }

.grid { display: none; }
.f-white, .f-paper, .f-night, .clamp {
  stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke;
}
.f-white { fill: var(--white); }
.f-grad { fill: url(#cardg); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.f-paper, .clamp { fill: var(--paper); }
.f-night { fill: var(--night); }
.s-dash { stroke-dasharray: 4 3; }
.ink-line, .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.dot, .bar { fill: var(--ink); }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .3px; letter-spacing: .06px; fill: var(--ink); }
.tiny { font-family: var(--mono); font-weight: 500; font-size: .2px; letter-spacing: .05px; fill: var(--ink); }
.tiny.end { text-anchor: end; } .tiny.mid { text-anchor: middle; } .tiny.big { font-size: .23px; } .tiny.inv { fill: var(--white); opacity: .75; }
.nixie { font-family: var(--zen); font-size: .42px; text-anchor: middle; fill: var(--white); opacity: 0; }
.tagf { fill: var(--signal); stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.tagt { font-family: var(--mono); font-weight: 500; font-size: .26px; letter-spacing: .05px; fill: var(--white); }

/* resting state, also the reduced-motion state: badge assembled, access short, three days left, shadow AI flagged */
.d3 { opacity: 1; }
.bar { transform: scaleX(.3); }
.clamp { fill: var(--night); }

@keyframes drop0 {
  0.000% { transform: translateY(-53.4px); }
  12.857% { transform: translateY(-53.4px); }
  22.143% { transform: translateY(0); }
  71.429% { transform: translateY(0); }
  82.143% { transform: translateY(-53.4px); }
  100.000% { transform: translateY(-53.4px); }
}
.k0 { animation: drop0 7.0s var(--ease) infinite; }
@keyframes lamp0 {
  0.000% { fill: var(--paper); }
  21.857% { fill: var(--paper); }
  22.143% { fill: var(--night); }
  23.000% { fill: var(--paper); }
  23.857% { fill: var(--night); }
  71.429% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.cl0 { animation: lamp0 7.0s steps(1,end) infinite; }
@keyframes drop1 {
  0.000% { transform: translateY(-87.9px); }
  14.286% { transform: translateY(-87.9px); }
  23.571% { transform: translateY(0); }
  70.000% { transform: translateY(0); }
  80.714% { transform: translateY(-87.9px); }
  100.000% { transform: translateY(-87.9px); }
}
.k1 { animation: drop1 7.0s var(--ease) infinite; }
@keyframes lamp1 {
  0.000% { fill: var(--paper); }
  23.286% { fill: var(--paper); }
  23.571% { fill: var(--night); }
  24.429% { fill: var(--paper); }
  25.286% { fill: var(--night); }
  70.000% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.cl1 { animation: lamp1 7.0s steps(1,end) infinite; }
@keyframes drop2 {
  0.000% { transform: translateY(-122.4px); }
  15.714% { transform: translateY(-122.4px); }
  25.000% { transform: translateY(0); }
  68.571% { transform: translateY(0); }
  79.286% { transform: translateY(-122.4px); }
  100.000% { transform: translateY(-122.4px); }
}

@keyframes lamp2 {
  0.000% { fill: var(--paper); }
  24.714% { fill: var(--paper); }
  25.000% { fill: var(--night); }
  25.857% { fill: var(--paper); }
  26.714% { fill: var(--night); }
  68.571% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}

  26.429% { transform: translateY(0); }
  67.143% { transform: translateY(0); }
  77.857% { transform: translateY(-156.9px); }
  100.000% { transform: translateY(-156.9px); }
}
.k3 { animation: drop3 7.0s var(--ease) infinite; }
@keyframes lamp3 {
  0.000% { fill: var(--paper); }
  26.143% { fill: var(--paper); }
  26.429% { fill: var(--night); }
  27.286% { fill: var(--paper); }
  28.143% { fill: var(--night); }
  67.143% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.cl3 { animation: lamp3 7.0s steps(1,end) infinite; }
@keyframes bar {
  0.000% { transform: scaleX(1); }
  27.857% { transform: scaleX(1); }
  38.571% { transform: scaleX(.3); }
  90.000% { transform: scaleX(.3); }
  97.857% { transform: scaleX(1); }
  100.000% { transform: scaleX(1); }
}
@keyframes dg0 {
  0.000% { opacity:0; }
  63.571% { opacity:1; }
  91.429% { opacity:0; }
  100.000% { opacity:0; }
}
.d0 { animation: dg0 7.0s steps(1,end) infinite; }

  100.000% { opacity:0; }

  49.286% { opacity:1; }
  52.857% { opacity:0; }
  100.000% { opacity:0; }
}
.d4 { animation: dg4 7.0s steps(1,end) infinite; }

  0.000% { opacity:0; }
  45.714% { opacity:1; }
  49.286% { opacity:0; }
  100.000% { opacity:0; }
}
.d5 { animation: dg5 7.0s steps(1,end) infinite; }
@keyframes dg6 {
  0.000% { opacity:0; }
  42.143% { opacity:1; }
  45.714% { opacity:0; }
  100.000% { opacity:0; }
}
.d6 { animation: dg6 7.0s steps(1,end) infinite; }
@keyframes dg7 {
  0.000% { opacity:1; }
  42.143% { opacity:0; }
  91.429% { opacity:1; }
  100.000% { opacity:1; }
}
.d7 { animation: dg7 7.0s steps(1,end) infinite; }
@keyframes flick {
  0.000% { opacity:1; }
  44.286% { opacity:1; }
  45.143% { opacity:.15; }
  46.286% { opacity:1; }
  47.143% { opacity:.3; }
  48.286% { opacity:1; }
  100.000% { opacity:1; }
}
@keyframes flag {
  0.000% { opacity:0; transform: translateY(6px); }
  49.286% { opacity:0; transform: translateY(6px); }
  55.714% { opacity:1; transform: translateY(0); }
  90.000% { opacity:1; transform: translateY(0); }
  97.143% { opacity:0; transform: translateY(6px); }
  100.000% { opacity:0; transform: translateY(6px); }
}
.bar { animation: bar 7s var(--ease) infinite; }
.shadow { animation: flick 7s steps(1, end) infinite; }
.tag { animation: flag 7s var(--ease) infinite; }

@media not all {
  .card, .clamp, .bar, .shadow, .tag, .nixie { animation: none !important; }
}
</style>
