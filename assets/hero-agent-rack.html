<title>Avistar Agent Rack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Dots&display=swap">
<style>
/* Layout: one isometric rack centred on paper; four agent cartridges take turns, the active cartridge lights up in the brand gradient, the only colour */
:root {
  --paper: #F5F3F0;
  --white: #FFFFFF;
  --ink: #141414;
  --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --zen: "Zen Dots", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }

.grid { display: none; }
.f-white, .f-paper, .f-night, .rivet, .grip, .lamp {
  stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke;
}
.f-white, .rivet { fill: var(--white); }
.f-paper, .grip { fill: var(--paper); }
.f-night { fill: var(--night); }
.ink-line, .ic, .cable { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .45; vector-effect: non-scaling-stroke; }
.badge { fill: var(--white); }
.dot { fill: var(--ink); }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .32px; letter-spacing: .07px; text-anchor: middle; fill: var(--ink); }
.lbl.small { font-size: .24px; letter-spacing: .06px; text-anchor: start; opacity: .7; }
.lbl.small.end { text-anchor: end; }
.zen { font-family: var(--zen); font-size: .44px; text-anchor: middle; fill: var(--ink); }

/* resting state, also used for reduced motion: FIND is up, lit, and carries the glow */
.lamp { fill: var(--paper); }
.c0 { transform: translateY(-10px); }
.c0 .lamp { fill: var(--night); }
.hl { opacity: 0; }
.hlf, .shade, .lift { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.shade { fill: var(--night); opacity: .38; }
.lift { fill: var(--white); opacity: .28; }
.hl .shade, .hl .lift { stroke: none; }
.c0 .hl { opacity: 1; }

/* 8s loop: each cartridge gets a 2s turn */
.cart { animation: lift 8s var(--ease) infinite; }
.cart .lamp { animation: lamp 8s steps(1, end) infinite; }
.c1, .c1 .lamp { animation-delay: 2s; }
.c2, .c2 .lamp { animation-delay: 4s; }
.c3, .c3 .lamp { animation-delay: 6s; }
.c1, .c2, .c3 { transform: translateY(0); }
.cart .hl { animation: glowup 8s var(--ease) infinite; }
.c1 .hl { animation-delay: 2s; } .c2 .hl { animation-delay: 4s; } .c3 .hl { animation-delay: 6s; }
.hand { animation: tick 8s steps(24, end) infinite; }

@keyframes lift {
  0%, 1%   { transform: translateY(0); }      /* 80ms stagger after the previous one starts down */
  7.5%     { transform: translateY(-10px); }
  20%      { transform: translateY(-10px); }
  25.5%, 100% { transform: translateY(0); }
}
@keyframes lamp {
  0%   { fill: var(--paper); }
  8%   { fill: var(--night); }
  9.5% { fill: var(--paper); }
  11%  { fill: var(--night); }
  12.5% { fill: var(--paper); }
  14%  { fill: var(--night); }
  21.5%, 100% { fill: var(--paper); }
}
@keyframes glowup {
  0%, 1%   { opacity: 0; }
  7.5%     { opacity: 1; }
  20%      { opacity: 1; }
  25.5%, 100% { opacity: 0; }
}
@keyframes tick { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@media not all {
  .cart, .cart .lamp, .cart .hl, .hand { animation: none; }
}
</style>
