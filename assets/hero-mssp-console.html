<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar MSSP Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one Avistar console with three client cubes cabled to it on paper; the cable glow is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night, .lamp { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper, .lamp { fill: var(--paper); } .f-night { fill: var(--night); }
.ink-line, .needle { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.needle { stroke-width: 2; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .5; vector-effect: non-scaling-stroke; }
.dot { fill: var(--ink); }
.cable { fill: none; stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
.hold, .run { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.run { stroke-dasharray: 18 200; }
.scr { fill: var(--night); }
.scr-edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.glass { fill: none; stroke: #ffffff; stroke-width: 1; opacity: .3; }
.scanl { fill: none; stroke: #ffffff; stroke-width: .5; opacity: .1; vector-effect: non-scaling-stroke; }
.bar { fill: none; stroke: #ffffff; stroke-width: 6; stroke-linecap: butt; vector-effect: non-scaling-stroke; }
.base { fill: none; stroke: #ffffff; stroke-width: 1; opacity: .6; vector-effect: non-scaling-stroke; }
.screen { opacity: 0; }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .2px; letter-spacing: .05px; text-anchor: middle; fill: var(--ink); }
.lbl.wide { font-size: .3px; letter-spacing: .1px; } .lbl.sm { font-size: .18px; } .lbl.xs { font-size: .13px; letter-spacing: .02px; }
.tagt { font-family: var(--mono); font-weight: 500; font-size: .12px; text-anchor: middle; fill: var(--ink); }
/* resting state, also used for reduced motion: screen on, clients lit and connected, report out, dial advanced */
.screen { opacity: 1; }
.hold { opacity: .55; }
.lamp { fill: var(--night); }
.dial { transform: rotate(10deg); }
.rep { transform: translate(-8.66px,5.00px); }

@keyframes screen {
  0.000% { opacity:0; }
  5.714% { opacity:1; }
  6.714% { opacity:.2; }
  7.714% { opacity:1; }
  8.714% { opacity:.35; }
  9.714% { opacity:1; }
  88.571% { opacity:1; }
  88.857% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes r0 {
  0.000% { stroke-dashoffset: 18; opacity:1; }
  14.286% { stroke-dashoffset: 18; opacity:1; }
  27.143% { stroke-dashoffset: -100; opacity:1; }
  27.286% { stroke-dashoffset: -100; opacity:0; }
  100.000% { stroke-dashoffset: 18; opacity:0; }
}
.r0 { animation: r0 7s var(--ease) infinite; }
@keyframes h0 {
  0.000% { opacity:0; }
  24.286% { opacity:0; }
  31.429% { opacity:.55; }
  84.286% { opacity:.55; }
  92.857% { opacity:0; }
  100.000% { opacity:0; }
}
.h0 { animation: h0 7s var(--ease) infinite; }
@keyframes l0 {
  0.000% { fill: var(--paper); }
  27.143% { fill: var(--night); }
  28.143% { fill: var(--paper); }
  29.143% { fill: var(--night); }
  90.000% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.l0 { animation: l0 7s steps(1,end) infinite; }
@keyframes r1 {
  0.000% { stroke-dashoffset: 18; opacity:1; }
  16.429% { stroke-dashoffset: 18; opacity:1; }
  29.286% { stroke-dashoffset: -100; opacity:1; }
  29.429% { stroke-dashoffset: -100; opacity:0; }
  100.000% { stroke-dashoffset: 18; opacity:0; }
}
.r1 { animation: r1 7s var(--ease) infinite; }
@keyframes h1 {
  0.000% { opacity:0; }
  26.429% { opacity:0; }
  33.571% { opacity:.55; }
  84.286% { opacity:.55; }
  92.857% { opacity:0; }
  100.000% { opacity:0; }
}
.h1 { animation: h1 7s var(--ease) infinite; }
@keyframes l1 {
  0.000% { fill: var(--paper); }
  29.286% { fill: var(--night); }
  30.286% { fill: var(--paper); }
  31.286% { fill: var(--night); }
  90.000% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.l1 { animation: l1 7s steps(1,end) infinite; }
@keyframes r2 {
  0.000% { stroke-dashoffset: 18; opacity:1; }
  18.571% { stroke-dashoffset: 18; opacity:1; }
  31.429% { stroke-dashoffset: -100; opacity:1; }
  31.571% { stroke-dashoffset: -100; opacity:0; }
  100.000% { stroke-dashoffset: 18; opacity:0; }
}
.r2 { animation: r2 7s var(--ease) infinite; }
@keyframes h2 {
  0.000% { opacity:0; }
  28.571% { opacity:0; }
  35.714% { opacity:.55; }
  84.286% { opacity:.55; }
  92.857% { opacity:0; }
  100.000% { opacity:0; }
}
.h2 { animation: h2 7s var(--ease) infinite; }
@keyframes l2 {
  0.000% { fill: var(--paper); }
  31.429% { fill: var(--night); }
  32.429% { fill: var(--paper); }
  33.429% { fill: var(--night); }
  90.000% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.l2 { animation: l2 7s steps(1,end) infinite; }
@keyframes dial {
  0.000% { transform: rotate(-110deg); }
  40.000% { transform: rotate(-110deg); }
  42.857% { transform: rotate(-80deg); }
  45.714% { transform: rotate(-50deg); }
  48.571% { transform: rotate(-20deg); }
  51.429% { transform: rotate(10deg); }
  90.000% { transform: rotate(10deg); }
  90.286% { transform: rotate(-110deg); }
  100.000% { transform: rotate(-110deg); }
}
@keyframes rep {
  0.000% { transform: translate(0,0); }
  48.571% { transform: translate(0,0); }
  55.714% { transform: translate(-8.66px,5.00px); }
  88.571% { transform: translate(-8.66px,5.00px); }
  97.143% { transform: translate(0,0); }
  100.000% { transform: translate(0,0); }
}
.screen { animation: screen 7s steps(1, end) infinite; }
.dial { animation: dial 7s steps(1, end) infinite; }
.rep { animation: rep 7s var(--ease) infinite; }
@media not all {
  .screen, .run, .hold, .lamp, .dial, .rep { animation: none !important; }
}
</style>
</head>
