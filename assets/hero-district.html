<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar District</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one round model plate with four regulated buildings around a read-only tower; the sweeping beam is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spin: cubic-bezier(0.65, 0, 0.35, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night, .win { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper, .win { fill: var(--paper); } .f-night { fill: var(--night); }
.win { stroke-width: 1; }
.rivet { fill: var(--white); stroke: var(--ink); stroke-width: 1; }
.cross { fill: var(--ink); stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
.ink-line { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; vector-effect: non-scaling-stroke; }
.dot { fill: var(--ink); }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .17px; letter-spacing: .03px; text-anchor: middle; fill: var(--ink); }
.tagt { font-family: var(--mono); font-weight: 500; font-size: .14px; letter-spacing: .01px; text-anchor: middle; fill: var(--ink); }
.spin path { mix-blend-mode: multiply; }
/* resting state, also used for reduced motion: every building lit and owned, beam resting on Finance */
.win { fill: var(--night); }
.spin { transform: rotate(135deg); }
@keyframes w0 {
  0.000% { fill: var(--paper); }
  31.232% { fill: var(--night); }
  32.232% { fill: var(--paper); }
  33.232% { fill: var(--night); }
  96.250% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.w0 { animation: w0 8s steps(1,end) infinite; }
@keyframes t0 {
  0.000% { opacity:0; transform: translateY(-.3px); }
  33.107% { opacity:0; transform: translateY(-.3px); }
  38.732% { opacity:1; transform: translateY(0); }
  94.375% { opacity:1; transform: translateY(0); }
  98.125% { opacity:0; transform: translateY(0); }
  100.000% { opacity:0; transform: translateY(-.3px); }
}
.t0 { animation: t0 8s var(--ease) infinite; }
@keyframes w1 {
  0.000% { fill: var(--paper); }
  45.470% { fill: var(--night); }
  46.470% { fill: var(--paper); }
  47.470% { fill: var(--night); }
  96.250% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.w1 { animation: w1 8s steps(1,end) infinite; }
@keyframes t1 {
  0.000% { opacity:0; transform: translateY(-.3px); }
  47.345% { opacity:0; transform: translateY(-.3px); }
  52.970% { opacity:1; transform: translateY(0); }
  94.375% { opacity:1; transform: translateY(0); }
  98.125% { opacity:0; transform: translateY(0); }
  100.000% { opacity:0; transform: translateY(-.3px); }
}
.t1 { animation: t1 8s var(--ease) infinite; }
@keyframes w2 {
  0.000% { fill: var(--paper); }
  68.768% { fill: var(--night); }
  69.768% { fill: var(--paper); }
  70.768% { fill: var(--night); }
  96.250% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.w2 { animation: w2 8s steps(1,end) infinite; }
@keyframes t2 {
  0.000% { opacity:0; transform: translateY(-.3px); }
  70.643% { opacity:0; transform: translateY(-.3px); }
  76.268% { opacity:1; transform: translateY(0); }
  94.375% { opacity:1; transform: translateY(0); }
  98.125% { opacity:0; transform: translateY(0); }
  100.000% { opacity:0; transform: translateY(-.3px); }
}
.t2 { animation: t2 8s var(--ease) infinite; }
@keyframes w3 {
  0.000% { fill: var(--paper); }
  54.530% { fill: var(--night); }
  55.530% { fill: var(--paper); }
  56.530% { fill: var(--night); }
  96.250% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.w3 { animation: w3 8s steps(1,end) infinite; }
@keyframes t3 {
  0.000% { opacity:0; transform: translateY(-.3px); }
  56.405% { opacity:0; transform: translateY(-.3px); }
  62.030% { opacity:1; transform: translateY(0); }
  94.375% { opacity:1; transform: translateY(0); }
  98.125% { opacity:0; transform: translateY(0); }
  100.000% { opacity:0; transform: translateY(-.3px); }
}
.t3 { animation: t3 8s var(--ease) infinite; }
.spin { animation: spin 8s var(--spin) infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@media not all {
  .spin, .win, .tag { animation: none !important; }
}
</style>
</head>
