<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-bleed side view of one glass pipeline, Avistar chamber at center, story rail bottom-left. Single dark look by design. */
:root{
  --signal:#FF4B1F;
  --ion:#1FDDFF;
  --black:#0B0B0C;
  --ink:#141414;
  --paper:#F5F3F0;
  --muted:#8C8E93;
  --line:rgba(245,243,240,.12);
  --panel:rgba(20,20,20,.72);
  --display:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--black);color:var(--paper);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.ui{transition:opacity .4s ease}
body.clean .ui{opacity:0;pointer-events:none}
.ui{display:none!important}body{background:transparent!important}

.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 22px);
  padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.brand svg{width:30px;height:30px;display:block}

.steps{position:fixed;left:max(28px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:min(380px,34vw);
  list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;isolation:isolate}
.steps::before{content:"";position:absolute;left:-160px;right:-200px;top:-140px;bottom:-120px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse at 30% 70%,rgba(11,11,12,.94) 0%,rgba(11,11,12,.82) 45%,rgba(11,11,12,0) 72%)}
.step button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr;align-items:center;column-gap:16px;width:100%;padding:6px 0;border-radius:12px}
.step button:focus-visible{outline:2px solid var(--ion);outline-offset:4px}
.num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);transition:all .35s ease}
.ttl{font-size:16px;font-weight:500;color:var(--muted);transition:color .35s ease;text-wrap:balance}
.hl{font-style:normal;background:linear-gradient(90deg,var(--signal),var(--ion));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.step:not(.on) .hl{opacity:.75}
.step.on .num{background:var(--paper);color:var(--black)}
.step.on .ttl{color:var(--paper);font-size:22px;font-weight:600;letter-spacing:-.01em}
.body{display:grid;grid-template-columns:44px 1fr;column-gap:16px;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
.step.on .body{grid-template-rows:1fr}
.body>*{overflow:hidden;min-height:0}
.rail{position:relative;justify-self:center;width:2px;background:var(--line);margin:0}
.rail i{position:absolute;left:0;top:0;width:2px;height:calc(var(--p,0)*100%);background:var(--paper)}
.body p{margin:0;padding:4px 0 14px;font-size:15px;line-height:1.55;color:rgba(245,243,240,.72);max-width:38ch}
.kicker{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.k1{color:var(--signal)}.k2{color:var(--paper)}.k3{color:var(--ion)}

@media (max-width:760px){
  .steps{bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:auto;right:max(16px,env(safe-area-inset-right,0px));left:max(16px,env(safe-area-inset-left,0px));
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;backdrop-filter:blur(10px)}
  .steps::before{display:none}
  .step:not(.on) button{display:none}
  .step.on .ttl{font-size:18px}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media not all{.ui,.body,.num,.ttl{transition:none}}
</style>

const P = [];

let T = 0, last = performance.now(), ripR = 0;
const mouse = { x: -1e4, y: -1e4, on: false };

  const gr = ctx.createLinearGradient(0, top, 0, top + h); gr.addColorStop(0, hi); gr.addColorStop(0.18, `rgb(${r},${g},${b})`); gr.addColorStop(0.55, `rgb(${r*0.8|0},${g*0.8|0},${b*0.8|0})`); gr.addColorStop(1, lo);

  const sh = ctx.createLinearGradient(x - w/2, 0, x + w/2, 0); sh.addColorStop(0, 'rgba(255,255,255,.28)'); sh.addColorStop(0.35, 'rgba(255,255,255,0)'); sh.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = sh; ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; radial(x, cy, w*2.2, R*1.2, [[0, rgba(k, .18)], [1, rgba(k, 0)]]); ctx.restore();
}
function leg(x){
  const w = RW*0.7, t = cy + R*0.9, b = floorY;
  ctx.beginPath(); ctx.moveTo(x - w*0.4, t); ctx.lineTo(x + w*0.4, t); ctx.lineTo(x + w*0.55, b); ctx.lineTo(x - w*0.55, b); ctx.closePath();
  const g = ctx.createLinearGradient(x - w, 0, x + w, 0); g.addColorStop(0, '#050506'); g.addColorStop(0.45, '#1d1d20'); g.addColorStop(1, '#050506');
  ctx.fillStyle = g; ctx.fill();
}
const LABELS = [[() => x0*0.5, 'UNMAPPED ACCESS', 0, 0], [() => cx, 'AVISTAR', 1, 1], [() => x1 + (vw - x1)*0.5, 'MAPPED · OWNED · RANKED', 2, 23]];
function drawLabels(){
  const y = cy - R*1.07 - 34;
  ctx.font = `500 ${narrow ? 10 : 11}px "Geist Mono", ui-monospace, monospace`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  try { ctx.letterSpacing = '1.5px'; } catch (e) {}
  for (const [fx, s, j, k] of LABELS) {
    if (narrow && j !== 1) continue;
    const x = fx(), on = em[j];
    ctx.globalAlpha = 0.35 + 0.65*on;
    ctx.fillStyle = '#F5F3F0'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = '#0B0B0C'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x-4, y); ctx.lineTo(x+4, y); ctx.moveTo(x, y-4); ctx.lineTo(x, y+4); ctx.stroke();
    ctx.fillStyle = j === 1 ? '#F5F3F0' : rgba(k, 0.95); ctx.fillText(s, x, y - 22);
    ctx.strokeStyle = 'rgba(245,243,240,.22)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + 9); ctx.lineTo(x, cy - R*1.07 - 4); ctx.stroke();
  }
  ctx.globalAlpha = 1; try { ctx.letterSpacing = '0px'; } catch (e) {}
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#0B0B0C'; ctx.fillRect(0, 0, vw, vh);
  // wall and floor light from the chamber
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  radial(cx, cy - R*0.6, W*1.5, vh*0.75, [[0, 'rgba(120,100,95,.16)'], [0.5, 'rgba(60,55,58,.06)'], [1, 'rgba(0,0,0,0)']]);
  radial(cx - W*0.22, floorY, W*0.9, R*1.3, [[0, rgba(1, .22*em[1] + .08)], [1, rgba(1, 0)]]);
  radial(cx + W*0.22, floorY, W*0.9, R*1.3, [[0, rgba(22, .18*em[1] + .07)], [1, rgba(22, 0)]]);
  ctx.restore();
  drawCells();

  // pipe body: dark smoked glass running edge to edge
  const pg = ctx.createLinearGradient(0, cy - R, 0, cy + R);
  pg.addColorStop(0, 'rgba(30,30,34,.94)'); pg.addColorStop(0.16, 'rgba(48,48,54,.9)'); pg.addColorStop(0.3, 'rgba(22,22,25,.86)'); pg.addColorStop(0.7, 'rgba(12,12,13,.86)'); pg.addColorStop(1, 'rgba(5,5,6,.95)');
  ctx.fillStyle = pg; ctx.fillRect(0, cy - R, x0, 2*R); ctx.fillRect(x1, cy - R, vw - x1, 2*R);
  // shadow line on the floor under the pipe
  ctx.save(); ctx.globalAlpha = 0.6; radial(cx, floorY + 2, vw*0.6, 6, [[0, 'rgba(0,0,0,.9)'], [1, 'rgba(0,0,0,0)']]); ctx.restore();

  // frosted chamber glass
  const cg = ctx.createLinearGradient(0, cy - R, 0, cy + R);
  cg.addColorStop(0, 'rgba(245,243,240,.16)'); cg.addColorStop(0.2, 'rgba(245,243,240,.26)'); cg.addColorStop(0.5, 'rgba(245,243,240,.12)'); cg.addColorStop(1, 'rgba(245,243,240,.06)');
  ctx.fillStyle = cg; ctx.fillRect(x0, cy - R, W, 2*R);
  drawParticles();
  ctx.save(); ctx.beginPath(); ctx.rect(x0, cy - R, W, 2*R); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
  const hx = cx - W*0.2 + Math.sin(T*0.7)*W*0.14, e1 = em[1];
  const lg = ctx.createLinearGradient(x0, 0, x1, 0); lg.addColorStop(0, rgba(0, .22*e1 + .06)); lg.addColorStop(0.5, `rgba(245,243,240,${.12*e1 + .04})`); lg.addColorStop(1, rgba(23, .22*e1 + .06));
  ctx.fillStyle = lg; ctx.fillRect(x0, cy - R, W, 2*R);
  radial(hx, cy, R*1.25, R*1.05, [[0, `rgba(255,236,214,${.75*e1 + .2})`], [0.35, `rgba(255,170,120,${.3*e1 + .08})`], [1, 'rgba(255,120,60,0)']]);
  radial(cx + W*0.24, cy, R*1.1, R*0.9, [[0, rgba(23, .35*e1 + .08)], [1, rgba(23, 0)]]);
  ctx.restore();
  // etched mark on the glass
  ctx.save(); ctx.translate(cx + W*0.02, cy); const k = (R*0.95)/4010; ctx.scale(k, k); ctx.translate(-3197, -2492);
  ctx.globalAlpha = 0.22 + 0.18*e1; ctx.fillStyle = '#F5F3F0'; ctx.fill(logoPath); ctx.restore(); ctx.globalAlpha = 1;

  // light travelling along the pipe core, warm on the left and cool on the right
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sl = ctx.createLinearGradient(0, 0, x0, 0); sl.addColorStop(0, rgba(0, 0)); sl.addColorStop(0.55, rgba(0, .1*em[0])); sl.addColorStop(1, rgba(0, .22*em[0] + .05));
  ctx.fillStyle = sl; ctx.fillRect(0, cy - R*0.1, x0, R*0.2);
  const sr = ctx.createLinearGradient(x1, 0, vw, 0); sr.addColorStop(0, rgba(23, .22*em[2] + .05)); sr.addColorStop(0.45, rgba(23, .1*em[2])); sr.addColorStop(1, rgba(23, 0));
  ctx.fillStyle = sr; ctx.fillRect(x1, cy - R*0.1, vw - x1, R*0.2);
  ctx.restore();
  // specular highlight along the top of the tube
  const sp = ctx.createLinearGradient(0, 0, vw, 0); sp.addColorStop(0, 'rgba(255,255,255,0)'); sp.addColorStop(0.3, 'rgba(255,255,255,.07)'); sp.addColorStop(0.5, 'rgba(255,255,255,.16)'); sp.addColorStop(0.7, 'rgba(255,255,255,.07)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sp; ctx.fillRect(0, cy - R*0.72, vw, Math.max(1.5, R*0.05));

  leg(x0); leg(x1);
  ring(x0, 0); ring(x1, 23);

  const vg = ctx.createRadialGradient(cx, cy, Math.min(vw, vh)*0.4, cx, cy, Math.max(vw, vh)*0.8);
  vg.addColorStop(0, 'rgba(11,11,12,0)'); vg.addColorStop(1, 'rgba(11,11,12,.5)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
}

function resize(){
  if (!innerWidth || !innerHeight) return; dpr = Math.min(window.devicePixelRatio || 1, 2); vw = innerWidth; vh = innerHeight;
  cv.width = Math.round(vw*dpr); cv.height = Math.round(vh*dpr);
  geometry(); buildGrid();
  P.length = 0; const gap = (R*2.6)/(narrow ? 12 : 18);
  for (let x = -20; x < vw + 20; x += gap) spawn(x + Math.random()*gap);
  for (let i = 0; i < 90; i++) update(1/30, 0);
}
function loop(now){
  const realDt = Math.min(0.05, (now - last)/1000); last = now;
  const dt = realDt*(RM.matches ? 0.35 : 1); T += dt;
  update(dt, realDt); render(); requestAnimationFrame(loop);
}

cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === 'mouse'; });
cv.addEventListener('pointerleave', () => { mouse.on = false; });
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('clean');
  if (e.key === 'ArrowRight') setStep(step + 1);
  if (e.key === 'ArrowLeft') setStep(step - 1);
});
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(resize, 60); }).observe(document.documentElement);
let lw = 0, lh = 0; setInterval(() => { if (innerWidth !== lw || innerHeight !== lh) { lw = innerWidth; lh = innerHeight; if (lw && lh && (cv.width === 0 || Math.round(lw*dpr) !== cv.width)) resize(); } }, 400);

resize();
requestAnimationFrame(t => { last = t; loop(t); });
})();
</script>
