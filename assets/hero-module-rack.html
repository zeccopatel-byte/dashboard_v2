<style>
/* Layout: one long isometric rack on paper; the Avistar core on the left, three plug-in modules patched into it. The cable glow is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night, .lamp { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper, .lamp { fill: var(--paper); } .f-night { fill: var(--night); }
.slot { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 3 3; opacity: .45; }
.ink-line, .ic { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.icf { fill: var(--white); stroke: var(--ink); stroke-width: 1.3; vector-effect: non-scaling-stroke; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .55; vector-effect: non-scaling-stroke; }
.cable { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 0; }
.glow { fill: none; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 22 200; stroke-dashoffset: 22; }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .22px; letter-spacing: .05px; text-anchor: middle; fill: var(--ink); }
.lbl.wide { font-size: .26px; letter-spacing: .12px; }
.soon { font-family: var(--mono); font-weight: 500; font-size: .13px; letter-spacing: .03px; text-anchor: middle; fill: var(--white); }
.dm { font-family: var(--mono); font-weight: 500; font-size: .15px; letter-spacing: .01px; fill: var(--ink); }
.dm.hd { text-anchor: middle; font-size: .14px; letter-spacing: .05px; }
.dim { --ink: #A6A7A9; --night: #8C8D90; --white: #FAFAF8; }
.cab.dim .glow { opacity: .45; }
/* resting state, also used for reduced motion: all modules in, patched and lit, API dimmed */
.mod { opacity: 1; }
.lamp { fill: var(--night); }
.feed { transform: translateY(-0.93px); }
.glow { stroke-dashoffset: -40; }

@keyframes m0 {
  0.000% { transform: translate(-41.57px,24.00px); opacity:0; }
  5.714% { transform: translate(-41.57px,24.00px); opacity:0; }
  14.286% { transform: translate(-0.00px,0.00px); opacity:1; }
  89.143% { transform: translate(-0.00px,0.00px); opacity:1; }
  96.286% { transform: translate(-41.57px,24.00px); opacity:0; }
  100.000% { transform: translate(-41.57px,24.00px); opacity:0; }
}
.m0 { animation: m0 7s var(--ease) infinite; }
@keyframes cb0 {
  0.000% { opacity:0; }
  17.143% { opacity:1; }
  83.571% { opacity:1; }
  85.714% { opacity:0; }
  100.000% { opacity:0; }
}
.c0 { animation: cb0 7s linear infinite; }
@keyframes cl0 {
  0.000% { stroke-dashoffset:1; }
  17.143% { stroke-dashoffset:1; }
  24.286% { stroke-dashoffset:0; }
  100.000% { stroke-dashoffset:0; }
}
.c0 .cable { animation: cl0 7s var(--ease) infinite; }
@keyframes pl0 {
  0.000% { opacity:0; }
  24.000% { opacity:0; }
  24.286% { opacity:1; }
  100.000% { opacity:1; }
}
.p0 { animation: pl0 7s steps(1,end) infinite; }
@keyframes l0 {
  0.000% { fill: var(--paper); }
  24.286% { fill: var(--night); }
  25.286% { fill: var(--paper); }
  26.286% { fill: var(--night); }
  84.286% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
.l0 { animation: l0 7s steps(1,end) infinite; }
@keyframes g0 {

  28.571% { stroke-dashoffset: 22; }
  42.857% { stroke-dashoffset: -100; }
  43.000% { stroke-dashoffset: 22; }

  87.429% { transform: translate(-0.00px,0.00px); opacity:1; }
  94.571% { transform: translate(-41.57px,24.00px); opacity:0; }
  100.000% { transform: translate(-41.57px,24.00px); opacity:0; }
}
.m1 { animation: m1 7s var(--ease) infinite; }
@keyframes cb1 {

  83.571% { opacity:1; }
  85.714% { opacity:0; }

.g2 { animation: g2 7s linear infinite; }
@keyframes feed {
  0.000% { transform: translateY(0); }

  26.000% { transform: translateY(-0.67px); }
  27.714% { transform: translateY(-0.93px); }
  90.000% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.feed { animation: feed 7s steps(1, end) infinite; }
@media not all {
  .mod, .cab, .cable, .plugs, .lamp, .glow, .feed { animation: none !important; }
}
