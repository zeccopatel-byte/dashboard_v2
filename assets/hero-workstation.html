<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar Workstation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one round plate with the Avistar core at the centre and four CRT monitors around it; the core glow is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper { fill: var(--paper); } .f-night { fill: var(--night); }
.ink-line, .cable { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.arm { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; opacity: .85; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .5; }
.scr-bg { fill: #0B0B0C; }
.scr-edge { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.crt { fill: none; stroke: #ffffff; stroke-width: 1; opacity: .35; }
.sl { fill: none; stroke: #ffffff; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.sl.thick { stroke-width: 1.8; }
.scr-dot { fill: #ffffff; }
.scr-fill { fill: #ffffff; }
.docf { fill: #0B0B0C; stroke: #ffffff; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
.scan { fill: none; stroke: #ffffff; stroke-width: .5; opacity: .08; vector-effect: non-scaling-stroke; }
.sweep { fill: #ffffff; opacity: 0; }
.blamp { fill: var(--white); stroke: #ffffff; stroke-width: 1.1; vector-effect: non-scaling-stroke; }
.gck { stroke-dasharray: 1 2; stroke-dashoffset: 0; }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .22px; letter-spacing: .06px; text-anchor: middle; fill: var(--ink); }
.lbl.wide { font-size: .3px; letter-spacing: .1px; }
.tagt { font-family: var(--mono); font-weight: 500; font-size: .1px; text-anchor: middle; fill: #0B0B0C; }
.tagt2 { font-family: var(--mono); font-weight: 500; font-size: .1px; text-anchor: end; fill: #ffffff; opacity: .8; }
/* resting state, also used for reduced motion: every screen on with its action finished */
.needle { transform: rotate(32deg); }
@keyframes o0 {
  0.000% { opacity:0; }
  12.500% { opacity:1; }
  13.250% { opacity:.2; }
  14.000% { opacity:1; }
  14.750% { opacity:.4; }
  15.500% { opacity:1; }
  82.500% { opacity:1; }
  82.750% { opacity:0; }
  100.000% { opacity:0; }
}
.o0 { animation: o0 8s steps(1,end) infinite; }
@keyframes s0 {
  0.000% { transform: translateY(0); opacity:0; }
  12.500% { transform: translateY(0); opacity:.7; }
  20.000% { transform: translateY(1.3px); opacity:.7; }
  20.250% { transform: translateY(1.3px); opacity:0; }
  100.000% { transform: translateY(0); opacity:0; }
}
.s0 { animation: s0 8s steps(8,end) infinite; }
@keyframes o1 {
  0.000% { opacity:0; }
  14.375% { opacity:1; }
  15.125% { opacity:.2; }
  15.875% { opacity:1; }
  16.625% { opacity:.4; }
  17.375% { opacity:1; }
  82.500% { opacity:1; }
  82.750% { opacity:0; }
  100.000% { opacity:0; }
}
.o1 { animation: o1 8s steps(1,end) infinite; }
@keyframes s1 {
  0.000% { transform: translateY(0); opacity:0; }
  14.375% { transform: translateY(0); opacity:.7; }
  21.875% { transform: translateY(1.3px); opacity:.7; }
  22.125% { transform: translateY(1.3px); opacity:0; }
  100.000% { transform: translateY(0); opacity:0; }
}
.s1 { animation: s1 8s steps(8,end) infinite; }
@keyframes o2 {
  0.000% { opacity:0; }
  16.250% { opacity:1; }
  17.000% { opacity:.2; }
  17.750% { opacity:1; }
  18.500% { opacity:.4; }
  19.250% { opacity:1; }
  82.500% { opacity:1; }
  82.750% { opacity:0; }
  100.000% { opacity:0; }
}
.o2 { animation: o2 8s steps(1,end) infinite; }
@keyframes s2 {
  0.000% { transform: translateY(0); opacity:0; }
  16.250% { transform: translateY(0); opacity:.7; }
  23.750% { transform: translateY(1.3px); opacity:.7; }
  24.000% { transform: translateY(1.3px); opacity:0; }
  100.000% { transform: translateY(0); opacity:0; }
}
.s2 { animation: s2 8s steps(8,end) infinite; }
@keyframes o3 {
  0.000% { opacity:0; }
  18.125% { opacity:1; }
  18.875% { opacity:.2; }
  19.625% { opacity:1; }
  20.375% { opacity:.4; }
  21.125% { opacity:1; }
  82.500% { opacity:1; }
  82.750% { opacity:0; }
  100.000% { opacity:0; }
}
.o3 { animation: o3 8s steps(1,end) infinite; }
@keyframes s3 {
  0.000% { transform: translateY(0); opacity:0; }
  18.125% { transform: translateY(0); opacity:.7; }
  25.625% { transform: translateY(1.3px); opacity:.7; }
  25.875% { transform: translateY(1.3px); opacity:0; }
  100.000% { transform: translateY(0); opacity:0; }
}
.s3 { animation: s3 8s steps(8,end) infinite; }
@keyframes needle {
  0.000% { transform: rotate(-80deg); }
  21.250% { transform: rotate(-80deg); }
  28.750% { transform: rotate(48deg); }
  35.000% { transform: rotate(32deg); }
  82.500% { transform: rotate(32deg); }
  82.750% { transform: rotate(-80deg); }
  100.000% { transform: rotate(-80deg); }
}
@keyframes tag {
  0.000% { opacity:0; transform: translateY(-.15px); }
  24.375% { opacity:0; transform: translateY(-.15px); }
  30.000% { opacity:1; transform: translateY(0); }
  100.000% { opacity:1; transform: translateY(0); }
}
@keyframes blamp {
  0.000% { fill: var(--night); }
  27.500% { fill: var(--white); }
  28.500% { fill: var(--night); }
  29.500% { fill: var(--white); }
  100.000% { fill: var(--white); }
}
@keyframes gck {
  0.000% { stroke-dashoffset:1; }
  30.625% { stroke-dashoffset:1; }
  35.625% { stroke-dashoffset:0; }
  100.000% { stroke-dashoffset:0; }
}
@keyframes glow {
  0.000% { opacity:.15; }
  6.250% { opacity:.15; }
  12.500% { opacity:1; }
  22.500% { opacity:.55; }
  32.500% { opacity:1; }
  42.500% { opacity:.55; }
  52.500% { opacity:1; }
  62.500% { opacity:.55; }
  72.500% { opacity:1; }
  82.500% { opacity:1; }
  90.000% { opacity:.15; }
  100.000% { opacity:.15; }
}
.needle { animation: needle 8s var(--ease) infinite; }
.tag { animation: tag 8s var(--ease) infinite; }
.blamp { animation: blamp 8s steps(1, end) infinite; }
.gck { animation: gck 8s var(--ease) infinite; }
.fglow { animation: glow 8s var(--ease) infinite; }
@media not all {
  .on, .sweep, .needle, .tag, .blamp, .gck, .fglow { animation: none !important; }
}
</style>
</head>
