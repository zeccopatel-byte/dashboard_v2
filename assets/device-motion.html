<title>Machine Identity Hero</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: single dark stage, circuit lines converge into a centered device, headline sits beneath */
:root {
  --ink: #07080a;
  --steel: #121316;
  --line: rgba(255,255,255,.075);
  --signal-red: #FF4B1F;
  --ion-cyan: #1FDDFF;
  --mid: #9b8e88;
  --text: #f2f1ee;
  --muted: rgba(242,241,238,.55);
  --display: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--text); height: 100%; }
body {
  font-family: var(--display);
  padding: 0; margin: 0; display: flex; align-items: center; justify-content: center;
  overflow-x: hidden;
}
.hero { width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }

/* stage */
.stage {
  position: relative; width: 100%; aspect-ratio: 1200 / 700; max-width: 100%;
  container-type: inline-size;
}
.stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(28% 38% at 34% 56%, rgba(255,75,31,.10), transparent 70%),
    radial-gradient(28% 38% at 66% 56%, rgba(31,221,255,.09), transparent 70%);
}
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.base path { fill: none; stroke: var(--line); stroke-width: 1; }
.pulse path {
  fill: none; stroke-width: 1.6; stroke-linecap: round;
  stroke-dasharray: 70 930; stroke-dashoffset: 1000;
  animation: travel var(--d, 4s) linear var(--delay, 0s) infinite;
}
.pulse .r path { stroke: var(--signal-red); }
.pulse .c path { stroke: var(--ion-cyan); }
@keyframes travel { to { stroke-dashoffset: 0; } }

/* device */
.device {
  position: absolute; left: 30.833%; top: 52.857%; width: 38.333%; aspect-ratio: 460 / 120;
  border-radius: 3.6cqw;
  background: linear-gradient(180deg, #2b2d31 0%, #16171a 38%, #0c0d0f 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(0,0,0,.6),
    inset .7cqw 0 1.1cqw -.5cqw rgba(255,75,31,.75),
    inset -.7cqw 0 1.1cqw -.5cqw rgba(31,221,255,.65),
    0 3cqw 5cqw rgba(0,0,0,.75),
    -2.4cqw 0 5cqw -1.6cqw rgba(255,75,31,.35),
    2.4cqw 0 5cqw -1.6cqw rgba(31,221,255,.3);
  animation: breathe 5s ease-in-out infinite;
}
@keyframes breathe { 50% { filter: brightness(1.18) saturate(1.1); } }
.device::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,75,31,.18), transparent 22%, transparent 78%, rgba(31,221,255,.16));
}
.screen {
  position: absolute; inset: 13% 4.2%; border-radius: 2.6cqw; overflow: hidden;
  background:
    radial-gradient(60% 120% at 22% 70%, rgba(255,75,31,.22), transparent 70%),
    radial-gradient(60% 120% at 78% 70%, rgba(31,221,255,.18), transparent 70%),
    #040506;
  border: 1px solid rgba(255,255,255,.12);
  box-shadow: inset 0 0 0 .25cqw #000, inset 0 .5cqw 1.2cqw rgba(0,0,0,.9);
  display: flex; align-items: center; justify-content: center; gap: 2.2cqw;
}
.screen::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.07), transparent 40%);
}
#pix { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.orb-wrap { position: relative; z-index: 1; width: 5.6cqw; height: 5.6cqw; flex: none; animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-.25cqw); } }
.orb-wrap::before {
  content: ""; position: absolute; inset: -45%; border-radius: 50%;
  background: radial-gradient(circle at 42% 50%, rgba(255,75,31,.45), transparent 55%),
              radial-gradient(circle at 60% 50%, rgba(31,221,255,.35), transparent 55%);
  filter: blur(.6cqw);
}
#orb { position: relative; width: 100%; height: 100%; display: block; border-radius: 50%; }

/* headline */
h1 {
  margin: clamp(8px, 2vw, 24px) 0 0; max-width: 19ch; text-align: center;
  font-weight: 600; font-size: clamp(2rem, 5.4vw, 4.4rem); line-height: 1.04; letter-spacing: -.035em;
  text-wrap: balance; color: var(--text);
}
h1 .grad {
  background: linear-gradient(90deg, var(--signal-red) 0%, #c8765f 22%, var(--mid) 48%, #6fb4c4 74%, var(--ion-cyan) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shift 8s ease-in-out infinite alternate;
}
@keyframes shift { from { background-position: 0% 0; } to { background-position: 100% 0; } }

@media not all {
  .pulse { display: none; }
  .device, h1 .grad, .orb-wrap { animation: none; }
}
</style>

    // find the sphere's disc
    let x0 = S, x1 = 0, y0 = S, y1 = 0;
    for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
      const i = (y * S + x) * 4;
      if (d[i] + d[i + 1] + d[i + 2] > 75) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, rad = Math.max(x1 - x0, y1 - y0) / 2 * 0.97;

    // unwrap the visible hemisphere into an albedo map; the back half mirrors the front
    tex = new Float32Array(TW * TH * 3);
    for (let ty = 0; ty < TH; ty++) {
      const lat = (ty / (TH - 1) - 0.5) * Math.PI;
      for (let tx = 0; tx < TW; tx++) {
        let lon = (tx / TW) * 2 * Math.PI - Math.PI;
        if (lon > Math.PI / 2) lon = Math.PI - lon; else if (lon < -Math.PI / 2) lon = -Math.PI - lon;
        const nx = Math.cos(lat) * Math.sin(lon), ny = Math.sin(lat), nz = Math.cos(lat) * Math.cos(lon);
        const sx = Math.min(S - 1, Math.max(0, Math.round(cx + nx * rad)));
        const sy = Math.min(S - 1, Math.max(0, Math.round(cy + ny * rad)));
        const i = (sy * S + sx) * 4, o = (ty * TW + tx) * 3;
        const dot = nx * L[0] + ny * L[1] + nz * L[2];
        const s = Math.max(0.42, shadeOf(dot)), spec = Math.pow(Math.max(0, dot), 26) * 95;
        tex[o] = Math.min(255, Math.max(0, (d[i] - spec) / s));
        tex[o + 1] = Math.min(255, Math.max(0, (d[i + 1] - spec) / s));
        tex[o + 2] = Math.min(255, Math.max(0, (d[i + 2] - spec) / s));
      }
    }
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const nx = (x - N / 2 + .5) / R, ny = (y - N / 2 + .5) / R, q = nx * nx + ny * ny;
      if (q <= 1) {
        const nz = Math.sqrt(1 - q), dot = nx * L[0] + ny * L[1] + nz * L[2];
        px.push([(y * N + x) * 4, nx, ny, nz, Math.asin(ny), shadeOf(dot), Math.pow(Math.max(0, dot), 26) * 95, Math.min(1, (1 - Math.sqrt(q)) * R * .9)]);
      }
    }
    if (reduce) draw(0); else requestAnimationFrame(loop);
  }

  const img = ctx.createImageData(N, N);
  function sample(u, v, o) {
    const fx = u * TW, fy = v * (TH - 1), x0 = Math.floor(fx), y0 = Math.floor(fy);
    const ax = fx - x0, ay = fy - y0, x1 = (x0 + 1) % TW, xa = ((x0 % TW) + TW) % TW, y1 = Math.min(TH - 1, y0 + 1);
    const i00 = (y0 * TW + xa) * 3, i10 = (y0 * TW + x1) * 3, i01 = (y1 * TW + xa) * 3, i11 = (y1 * TW + x1) * 3;
    for (let k = 0; k < 3; k++)
      o[k] = (tex[i00 + k] * (1 - ax) + tex[i10 + k] * ax) * (1 - ay) + (tex[i01 + k] * (1 - ax) + tex[i11 + k] * ax) * ay;
  }
  const col = [0, 0, 0];
  function draw(t) {
    const a = t * 0.00022, d = img.data, TAU = Math.PI * 2;
    for (const [i, nx, ny, nz, lat, sh, spec, al] of px) {
      const lon = Math.atan2(nx, nz) + a + Math.sin(lat * 3 + t * 0.0004) * 0.06;
      let u = (lon + Math.PI) / TAU; u -= Math.floor(u);
      sample(u, (lat / Math.PI) + 0.5, col);
      const rim = Math.pow(1 - nz, 3) * Math.max(0, nx) * 0.35;
      const grain = (Math.random() - 0.5) * 22;
      d[i] = col[0] * sh + spec + 31 * rim + grain;
      d[i + 1] = col[1] * sh + spec + 221 * rim + grain;
      d[i + 2] = col[2] * sh + spec + 255 * rim + grain;
      d[i + 3] = 255 * al;
    }
    ctx.putImageData(img, 0, 0);
  }
  let last = 0;
  function loop(t) { if (t - last > 33) { draw(t); last = t; } requestAnimationFrame(loop); }
})();
</script>
<script>
(function () {
  const reduce = matchMedia('not all').matches;
  const cv = document.getElementById('pix'), g = cv.getContext('2d');
  const orb = document.querySelector('.orb-wrap');
  const RED = [255, 75, 31], CYAN = [31, 221, 255];
  let W = 0, H = 0, cells = [];
  function layout() {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.width = Math.round(r.width * dpr); H = cv.height = Math.round(r.height * dpr);
    const rows = 7, cell = H * 0.66 / rows, top = (H - cell * rows) / 2;
    const orbR = orb.getBoundingClientRect().width * dpr / 2, gap = orbR + cell * 1.4;
    const cols = Math.floor((W / 2 - gap - W * 0.07) / cell);
    const old = cells; cells = [];
    for (const side of [-1, 1]) for (let c = 0; c < cols; c++) for (let y = 0; y < rows; y++) {
      const x = side < 0 ? W / 2 - gap - (c + 1) * cell : W / 2 + gap + c * cell;
      const near = 1 - c / cols; // denser close to the ball
      cells.push({ x, y: top + y * cell, s: cell, side, near, v: 0, t: 0, col: RED });
    }
    if (old.length === cells.length) cells.forEach((k, i) => { k.v = old[i].v; k.t = old[i].t; k.col = old[i].col; });
  }
  function retarget() {
    for (const k of cells) {
      const r = Math.random();
      if (k.t === 0 && r < 0.035 + 0.06 * k.near) {
        k.t = 0.55 + Math.random() * 0.45;
        const own = Math.random() < 0.78;
        k.col = (k.side < 0) === own ? RED : CYAN;
      } else if (k.t > 0 && r < 0.12) k.t = 0;
    }
  }
  function draw() {
    g.clearRect(0, 0, W, H);
    for (const k of cells) {
      k.v += (k.t - k.v) * 0.18;
      const p = k.s * 0.17, w = k.s - p * 2;
      g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.045)';
      g.fillRect(k.x + p, k.y + p, w, w);
      if (k.v > 0.02) {
        const [r, gg, b] = k.col;
        g.shadowColor = `rgba(${r},${gg},${b},${k.v})`; g.shadowBlur = k.s * 0.9;
        g.fillStyle = `rgba(${r},${gg},${b},${k.v})`;
        g.fillRect(k.x + p, k.y + p, w, w);
      }
    }
  }
  layout(); for (let i = 0; i < 6; i++) retarget(); cells.forEach(k => k.v = k.t); draw();
  new ResizeObserver(() => { layout(); draw(); }).observe(cv);
  if (reduce) return;
  let lastR = 0;
  (function loop(t) {
    if (t - lastR > 160) { retarget(); lastR = t; }
    draw(); requestAnimationFrame(loop);
  })(0);
})();
</script>
