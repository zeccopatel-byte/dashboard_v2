<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar Compliance Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Zen+Dots&display=swap">
<style>
/* Layout: an open card-index drawer and a dot-matrix printer on paper; the beam from cards to printer is the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --zen: "Zen Dots", "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white { fill: var(--white); } .f-paper { fill: var(--paper); } .f-night { fill: var(--night); }
.rim { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .4; vector-effect: non-scaling-stroke; }
.hole { fill: var(--paper); stroke: var(--ink); stroke-width: .6; vector-effect: non-scaling-stroke; }
.lead { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 1 2.5; opacity: .5; vector-effect: non-scaling-stroke; }
.ck { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .17px; letter-spacing: .03px; text-anchor: middle; fill: var(--ink); }
.lbl.sm { font-size: .17px; } .lbl.st { text-anchor: start; }
.dm { font-family: var(--mono); font-weight: 500; font-size: .16px; letter-spacing: .02px; fill: var(--ink); }
.dm.mid { text-anchor: middle; font-size: .14px; letter-spacing: .05px; opacity: .7; }
.zen { font-family: var(--zen); font-size: .28px; text-anchor: middle; fill: var(--white); opacity: 0; }
.r0 { opacity: 1; }
.b-h { fill: none; stroke: url(#bgr); stroke-width: 9; stroke-linecap: round; opacity: .9; }
.b-c { fill: none; stroke: url(#bgr); stroke-width: 1.6; stroke-linecap: round; }
/* resting state, also used for reduced motion: cards lifted, full report printed, 5 / 5 */
.feed { transform: translateY(-1.80px); }
.r5 { opacity: 1; }
.card { transform: translateY(-10px); }

@keyframes c0 {
  0.000% { transform: translateY(0); }
  11.429% { transform: translateY(0); }
  18.571% { transform: translateY(-10px); }
  72.857% { transform: translateY(-10px); }
  80.000% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.k0 { animation: c0 7s var(--ease) infinite; }
@keyframes c1 {
  0.000% { transform: translateY(0); }
  12.857% { transform: translateY(0); }
  20.000% { transform: translateY(-10px); }
  71.429% { transform: translateY(-10px); }
  78.571% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.k1 { animation: c1 7s var(--ease) infinite; }
@keyframes c2 {
  0.000% { transform: translateY(0); }
  14.286% { transform: translateY(0); }
  21.429% { transform: translateY(-10px); }
  70.000% { transform: translateY(-10px); }
  77.143% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.k2 { animation: c2 7s var(--ease) infinite; }
@keyframes c3 {
  0.000% { transform: translateY(0); }
  15.714% { transform: translateY(0); }
  22.857% { transform: translateY(-10px); }
  68.571% { transform: translateY(-10px); }
  75.714% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.k3 { animation: c3 7s var(--ease) infinite; }
@keyframes c4 {
  0.000% { transform: translateY(0); }
  17.143% { transform: translateY(0); }
  24.286% { transform: translateY(-10px); }
  67.143% { transform: translateY(-10px); }
  74.286% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.k4 { animation: c4 7s var(--ease) infinite; }
@keyframes feed {
  0.000% { transform: translateY(0); }
  14.286% { transform: translateY(-0.36px); }
  15.714% { transform: translateY(-0.72px); }
  17.143% { transform: translateY(-1.08px); }
  18.571% { transform: translateY(-1.44px); }
  20.000% { transform: translateY(-1.80px); }
  90.714% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
@keyframes r0 {
  0.000% { opacity:1; }
  14.286% { opacity:0; }
  90.714% { opacity:1; }
  100.000% { opacity:1; }
}
.r0 { animation: r0 7s steps(1,end) infinite; }
@keyframes r1 {
  0.000% { opacity:0; }
  14.286% { opacity:1; }
  15.714% { opacity:0; }
  100.000% { opacity:0; }
}
.r1 { animation: r1 7s steps(1,end) infinite; }
@keyframes r2 {
  0.000% { opacity:0; }
  15.714% { opacity:1; }
  17.143% { opacity:0; }
  100.000% { opacity:0; }
}
.r2 { animation: r2 7s steps(1,end) infinite; }
@keyframes r3 {
  0.000% { opacity:0; }
  17.143% { opacity:1; }
  18.571% { opacity:0; }
  100.000% { opacity:0; }
}
.r3 { animation: r3 7s steps(1,end) infinite; }
@keyframes r4 {
  0.000% { opacity:0; }
  18.571% { opacity:1; }
  20.000% { opacity:0; }
  100.000% { opacity:0; }
}
.r4 { animation: r4 7s steps(1,end) infinite; }
@keyframes r5 {
  0.000% { opacity:0; }
  20.000% { opacity:1; }
  90.714% { opacity:0; }
  100.000% { opacity:0; }
}
.r5 { animation: r5 7s steps(1,end) infinite; }
@keyframes beam {
  0.000% { opacity:0; }
  11.429% { opacity:0; }
  14.286% { opacity:1; }
  16.429% { opacity:.55; }
  18.571% { opacity:1; }
  20.714% { opacity:.55; }
  22.857% { opacity:1; }
  68.571% { opacity:1; }
  77.143% { opacity:0; }
  100.000% { opacity:0; }
}
@keyframes sheet {
  0.000% { transform: translate(0,0); opacity:1; }
  80.000% { transform: translate(0,0); opacity:1; }
  90.000% { transform: translate(.6px,-1.4px); opacity:0; }
  90.571% { transform: translate(.6px,-1.4px); opacity:0; }
  90.857% { transform: translate(0,0); opacity:0; }
  98.571% { transform: translate(0,0); opacity:1; }
  100.000% { transform: translate(0,0); opacity:1; }
}
.feed { animation: feed 7s steps(1, end) infinite; }
.beam { animation: beam 7s var(--ease) infinite; }
.sheet { animation: sheet 7s var(--ease) infinite; }
@media not all {
  .card, .feed, .beam, .sheet, .zen { animation: none !important; }
  .r0 { opacity: 0; }
}
</style>
