<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avistar Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one round desk plate on paper with a phone at the centre and contact channels around it; the ringing arcs are the only colour */
:root {
  --paper: #F5F3F0; --white: #FFFFFF; --ink: #141414; --night: url(#avnight);
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  
}
* { box-sizing: border-box; }
html, body { background: transparent; color: var(--ink); }
body {
  margin: 0; min-height: 100%;
  padding: 0;
  display: flex; justify-content: center; align-items: center;
}
svg.hero { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
.grid { display: none; }
.f-white, .f-paper, .f-night, .brass, .ext-top, .ext-side { stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.f-white, .ext-top { fill: var(--white); } .f-paper { fill: var(--paper); } .f-night, .ext-side { fill: var(--night); }
.brass { fill: var(--paper); stroke-width: 2; }
.ln { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ln.thin { stroke-width: 1.2; }
.band { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.hole { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
.lamp { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.arc { fill: none; stroke-width: 7; stroke-linecap: round; opacity: 0; }
.cal { font-family: var(--mono); font-weight: 700; font-size: .3px; text-anchor: middle; fill: var(--ink); opacity: 0; }
.cal.small { font-size: .2px; letter-spacing: .1px; opacity: .6; }
.k0 { opacity: 1; }
.flap { transform-box: fill-box; transform-origin: 50% 100%; }
.ink-thin { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .5; vector-effect: non-scaling-stroke; }
.lbl { font-family: var(--mono); font-weight: 500; font-size: .19px; letter-spacing: .05px; text-anchor: middle; fill: var(--ink); }
/* resting state, also used for reduced motion: handset lifted and ringing, letter posted, headset live, calendar on 30 MIN, demo card up */
.hand { transform: translateY(-8px); }
.a0,.a1,.a2 { opacity: 1; }
.letter { transform: translateY(24.0px); }
.lamp { fill: var(--night); }
.mega { transform: rotate(-6deg); }
.k0 { opacity:0; } .k2 { opacity:1; }
.demo { transform: translateY(-10px); }

@keyframes dial {
  0.000% { transform: rotate(0deg); }
  5.714% { transform: rotate(-28deg); }
  8.000% { transform: rotate(-56deg); }
  10.286% { transform: rotate(-84deg); }
  12.571% { transform: rotate(-112deg); }
  14.857% { transform: rotate(-140deg); }
  20.000% { transform: rotate(-140deg); }
  28.571% { transform: rotate(0deg); }
  100.000% { transform: rotate(0deg); }
}
@keyframes hand {
  0.000% { transform: translateY(0); }
  22.857% { transform: translateY(0); }
  30.000% { transform: translateY(-8px); }
  85.714% { transform: translateY(-8px); }
  92.857% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
@keyframes a0 {
  0.000% { opacity:0; transform: translateY(6px); }
  28.571% { opacity:0; transform: translateY(6px); }
  32.857% { opacity:1; transform: translateY(0); }
  42.857% { opacity:0; transform: translateY(-6px); }
  45.714% { opacity:0; transform: translateY(6px); }
  50.000% { opacity:1; transform: translateY(0); }
  60.000% { opacity:0; transform: translateY(-6px); }
  62.857% { opacity:0; transform: translateY(6px); }
  67.143% { opacity:1; transform: translateY(0); }
  77.143% { opacity:0; transform: translateY(-6px); }
  100.000% { opacity:0; transform: translateY(6px); }
}
.a0 { animation: a0 7s var(--ease) infinite; }
@keyframes a1 {
  0.000% { opacity:0; transform: translateY(6px); }
  31.143% { opacity:0; transform: translateY(6px); }
  35.429% { opacity:1; transform: translateY(0); }
  45.429% { opacity:0; transform: translateY(-6px); }
  48.286% { opacity:0; transform: translateY(6px); }
  52.571% { opacity:1; transform: translateY(0); }
  62.571% { opacity:0; transform: translateY(-6px); }
  65.429% { opacity:0; transform: translateY(6px); }
  69.714% { opacity:1; transform: translateY(0); }
  79.714% { opacity:0; transform: translateY(-6px); }
  100.000% { opacity:0; transform: translateY(6px); }
}
.a1 { animation: a1 7s var(--ease) infinite; }
@keyframes a2 {
  0.000% { opacity:0; transform: translateY(6px); }
  33.714% { opacity:0; transform: translateY(6px); }
  38.000% { opacity:1; transform: translateY(0); }
  48.000% { opacity:0; transform: translateY(-6px); }
  50.857% { opacity:0; transform: translateY(6px); }
  55.143% { opacity:1; transform: translateY(0); }
  65.143% { opacity:0; transform: translateY(-6px); }
  68.000% { opacity:0; transform: translateY(6px); }
  72.286% { opacity:1; transform: translateY(0); }
  82.286% { opacity:0; transform: translateY(-6px); }
  100.000% { opacity:0; transform: translateY(6px); }
}
.a2 { animation: a2 7s var(--ease) infinite; }
@keyframes letter {
  0.000% { transform: translateY(0); }
  34.286% { transform: translateY(0); }
  42.857% { transform: translateY(24.0px); }
  87.143% { transform: translateY(24.0px); }
  88.571% { transform: translateY(0); opacity:0; }
  94.286% { opacity:1; }
  100.000% { transform: translateY(0); }
}
@keyframes lamp {
  0.000% { fill: var(--paper); }
  42.857% { fill: var(--night); }
  44.000% { fill: var(--paper); }
  45.143% { fill: var(--night); }
  88.571% { fill: var(--paper); }
  100.000% { fill: var(--paper); }
}
@keyframes mega {
  0.000% { transform: rotate(0deg); }
  45.714% { transform: rotate(0deg); }
  52.857% { transform: rotate(-6deg); }
  85.714% { transform: rotate(-6deg); }
  92.857% { transform: rotate(0deg); }
  100.000% { transform: rotate(0deg); }
}
@keyframes k0 {
  0.000% { opacity:1; }
  51.429% { opacity:0; }
  91.429% { opacity:1; }
  100.000% { opacity:1; }
}
.k0 { animation: k0 7s steps(1,end) infinite; }
@keyframes k1 {
  0.000% { opacity:0; }
  51.429% { opacity:1; }
  57.143% { opacity:0; }
  100.000% { opacity:0; }
}
.k1 { animation: k1 7s steps(1,end) infinite; }
@keyframes k2 {
  0.000% { opacity:0; }
  57.143% { opacity:1; }
  91.429% { opacity:0; }
  100.000% { opacity:0; }
}
.k2 { animation: k2 7s steps(1,end) infinite; }
@keyframes flap {
  0.000% { transform: scaleY(1); }
  50.000% { transform: scaleY(1); }
  51.429% { transform: scaleY(0); }
  55.714% { transform: scaleY(1); }
  57.143% { transform: scaleY(0); }
  61.429% { transform: scaleY(1); }
  100.000% { transform: scaleY(1); }
}
@keyframes demo {
  0.000% { transform: translateY(0); }
  60.000% { transform: translateY(0); }
  67.143% { transform: translateY(-10px); }
  87.143% { transform: translateY(-10px); }
  94.286% { transform: translateY(0); }
  100.000% { transform: translateY(0); }
}
.dial { animation: dial 7s steps(1, end) infinite; }
.hand { animation: hand 7s var(--ease) infinite; }
.letter { animation: letter 7s var(--ease) infinite; }
.lamp { animation: lamp 7s steps(1, end) infinite; }
.mega { animation: mega 7s var(--ease) infinite; }
.flap { animation: flap 7s var(--ease) infinite; }
.demo { animation: demo 7s var(--ease) infinite; }
@media not all {
  .dial, .hand, .arc, .letter, .lamp, .mega, .flap, .demo, .cal { animation: none !important; }
}
</style>
</head>
